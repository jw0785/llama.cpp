name: Build (CUDA 13.2, Jetson Orin)

on:
  workflow_dispatch:
  push:
    branches: [jetson_orin]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  jetson-orin:
    runs-on: ubuntu-22.04-arm # glibc 2.35, runs fine on the Jetson's Ubuntu 24.04

    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          df -h /

      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: CUDA 13.2 (same Arm "sbsa" flavour as JetPack 7.2)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/sbsa/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-toolkit-13-2 build-essential cmake libssl-dev
          echo /usr/local/cuda/bin >> "$GITHUB_PATH"
          df -h /

      - name: Toolchain versions
        run: |
          nvcc --version
          gcc --version
          cmake --version

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: jetson-orin-cuda-13.2
          max-size: "1G"

      - name: Build
        id: cmake_build
        # libcuda.so.1 is not on the runner, the Jetson driver provides it at run time
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS=-mcpu=cortex-a78ae \
            -DCMAKE_CXX_FLAGS=-mcpu=cortex-a78ae \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined \
            -DCMAKE_CUDA_ARCHITECTURES=87-real \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_NCCL=OFF \
            -DGGML_CUDA_CCCL_VERSION=v3.4.3
          cmake --build build --config Release -j $(nproc)

      # bundle cudart/cublas next to the binaries ($ORIGIN rpath), never libcuda
      - name: Pack artifacts
        id: pack_artifacts
        run: |
          cp LICENSE ./build/bin/
          cp -L /usr/local/cuda/lib64/libcudart.so.13 ./build/bin/
          cp -L /usr/local/cuda/lib64/libcublas.so.13 ./build/bin/
          cp -L /usr/local/cuda/lib64/libcublasLt.so.13 ./build/bin/
          tar -czvf llama-cuda13.2-sm87-arm64.tar.gz -C ./build/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: llama-cuda13.2-sm87-arm64.tar.gz
          archive: false
